name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Do not open an issue: see SECURITY.md.
        Never paste a seed, a key, a private message or a real pubkey; redact logs.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: System
      description: OS and version, and Tor daemon or Arti if relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Command line and actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      render: text
