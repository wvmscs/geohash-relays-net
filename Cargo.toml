[package]
name = "geohash-relays-net"
version = "0.1.0"
edition = "2024"
description = "Communication for the geohash-relays strategies: the bitchat, bitchat-android and console implementations."
license = "GPL-3.0-or-later"
repository = "https://github.com/wvmscs/geohash-relays-net"

# Own workspace: the crate builds on its own, also inside another workspace.
[workspace]

[dependencies]
geohash-relays = { git = "https://github.com/wvmscs/geohash-relays.git", branch = "strategies" }
thiserror = "2"
tracing = "0.1"
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Tor in the binary (feature `arti`), like the iOS app.
arti-client = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls", "compression"] }
tor-rtcompat = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls"] }


[features]
default = []
# Exactly one of these three: whose communication functions are used.
bitchat = []
bitchat-android = []
console = []
# Tor inside the process (Arti), with any of them.
arti = ["dep:arti-client", "dep:tor-rtcompat"]
